<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXEL CLASH · 시안 기반 동작 검수</title><style>html,body{margin:0;background:#080a18;color:#fff5cf;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100dvh;object-fit:contain}#controls{position:fixed;right:16px;top:16px;display:flex;gap:8px}button{padding:10px;background:#0d1230;border:1px solid #ffd84d;color:#fff5cf;cursor:pointer}#status{position:fixed;left:16px;bottom:12px;font-size:12px;background:#080a18ba;padding:8px}</style></head><body><canvas id="scene"></canvas><div id="controls"><button id="play">재생</button><button id="capture">렌더 캡처</button></div><div id="status">에셋 준비 중</div><script src="scene.js"></script><script>
const params=new URLSearchParams(location.search),profile=params.get('profile')||'desktop',size={desktop:[1920,1080],mobile:[1080,1920],'mobile-lite':[720,1280]}[profile]||[1920,1080];
const canvas=document.querySelector('#scene');[canvas.width,canvas.height]=size;
window.__errors=[];window.addEventListener('error',e=>window.__errors.push(e.message));window.addEventListener('unhandledrejection',e=>window.__errors.push(String(e.reason)));
let scene,raf=0,started=0,recording=false;
window.__sceneReady=ConceptScene.create(canvas,profile).then(s=>{scene=window.__scene=s;s.draw(1600);document.querySelector('#status').textContent='준비 완료 · '+profile;return s;});
window.seekScene=async t=>{await window.__sceneReady;cancelAnimationFrame(raf);raf=0;scene.draw(t);return{state:canvas.dataset.state,profile,bullseye:scene.bullseye,titleBounds:scene.titleBounds,maxDrawMs:scene.maxDrawMs};};
function play(){cancelAnimationFrame(raf);started=performance.now();const loop=now=>{const t=now-started;scene.draw(Math.min(t,11999));document.querySelector('#status').textContent=profile+' · '+(t/1000).toFixed(2)+'s · '+canvas.dataset.state;if(t<12000)raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);}
window.captureScene=async()=>{await window.__sceneReady;if(recording)throw Error('Capture in progress');recording=true;cancelAnimationFrame(raf);document.querySelector('#controls').style.visibility='hidden';document.querySelector('#status').style.visibility='hidden';scene.draw(0);const stream=canvas.captureStream(30),chunks=[],type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!type)throw Error('No WebM recording encoder');const recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:profile==='mobile-lite'?8000000:14000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};const stopped=new Promise(resolve=>recorder.onstop=resolve);recorder.start();const begin=performance.now();await new Promise(resolve=>{const loop=now=>{const t=now-begin;scene.draw(Math.min(t,11999));if(t<12000)raf=requestAnimationFrame(loop);else resolve();};raf=requestAnimationFrame(loop);});recorder.stop();await stopped;stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type}),response=await fetch('/__capture/'+profile,{method:'POST',body:blob});if(!response.ok)throw Error('Capture upload failed');window.__captureResult={...await response.json(),profile,frames:scene.frames,maxDrawMs:scene.maxDrawMs,elapsedMs:Math.round(performance.now()-begin),errors:window.__errors};recording=false;document.querySelector('#controls').style.visibility='visible';document.querySelector('#status').style.visibility='visible';return window.__captureResult;};
document.querySelector('#play').onclick=()=>window.__sceneReady.then(play);document.querySelector('#capture').onclick=()=>window.captureScene().then(r=>document.querySelector('#status').textContent=JSON.stringify(r)).catch(e=>document.querySelector('#status').textContent=String(e));
</script></body></html>
